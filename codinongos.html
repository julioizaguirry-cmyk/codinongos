<style>
  :root {
    --ink: #1c2b4a;
    --line: rgba(28,43,74,.35);
    --purple: #e8398a;
    --red: #f2542d;
    --red-d: #a8280e;
    --blue: #1f8fd1;
    --blue-d: #0b4f86;
    --gold: #ffb81c;
    --cream: #fff1d6;
    --cream-d: #4d6a85;
    --pixel: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    --outline: #1c2b4a; --paper: #f3fbf8; --teal: #19b5a5;
    --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; min-height: 100%; background: var(--ink); color: var(--cream);
    font-family: var(--body); font-size: 18px; line-height: 1.2; overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body.shaking { animation: shake .45s steps(6) both; }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-7px, 3px); }
    40% { transform: translate(7px, -3px); }
    60% { transform: translate(-4px, 2px); }
    80% { transform: translate(3px, -2px); }
  }

  #bg { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; z-index: -2; }
  .crt {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.6) 100%),
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.16) 2px 3px);
    mix-blend-mode: multiply;
  }

  .topbar {
    position: relative; z-index: 40; display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 10px 12px 0;
  }
  .status {
    font-family: var(--pixel); font-size: 12px; background: var(--outline); padding: 8px 10px; border: 2px solid var(--outline);
    color: var(--cream-d);
  }
  .status.ok { color: #7dff9b; }
  .status.wait { color: var(--gold); }
  .status.bad { color: #ff8a9b; }

  .conn {
    position: fixed; top: 0; left: 0; right: 0; z-index: 70; background: var(--red); color: #fff;
    padding: 8px 12px; text-align: center; font-family: var(--pixel); font-size: 13.5px; line-height: 1.6;
    border-bottom: 3px solid var(--outline);
  }

  .screen {
    position: relative; z-index: 1; width: 100%; max-width: 1120px; margin: 0 auto;
    padding: 16px 16px 60px; min-height: 100dvh; display: flex; flex-direction: column; gap: 16px;
  }
  .muted { color: var(--cream-d); opacity: .85; }
  .small { font-size: 16.4px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .grow { flex: 1 1 200px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }

  /* ---------- logo / home ---------- */
  .home { display: flex; flex-direction: column; gap: 18px; align-items: center; text-align: center; }
  .logo { font-family: var(--pixel); font-size: clamp(42px, 7.5vw, 102px); line-height: 1.12; margin: 26px 0 6px; }
  .logo .l1 { display: block; color: var(--gold); text-shadow: 4px 4px 0 var(--red-d), -4px 0 0 var(--red), 4px 0 0 var(--blue), 0 8px 0 var(--outline); }
  .logo .l2 { display: block; color: var(--cream); text-shadow: 4px 4px 0 var(--blue-d), -4px 0 0 var(--blue), 4px 0 0 var(--red), 0 8px 0 var(--outline); }
  .tagline { font-size: 21.3px; max-width: 640px; margin: 0; color: var(--cream-d); }
  .home .panel { width: 100%; }
  .home .grid2 { width: 100%; }
  .howto { width: 100%; max-width: 720px; background: rgba(0,0,0,.35); border: 3px solid var(--line); padding: 10px 18px; text-align: left; }
  .howto summary { font-family: var(--pixel); font-size: 15px; color: var(--gold); cursor: pointer; padding: 6px 0; }
  .howto ol { margin: 8px 0; padding-left: 24px; font-size: 19.7px; }
  .ptitle { font-family: var(--pixel); font-size: 18px; color: var(--gold); margin: 0 0 12px; line-height: 1.5; }
  .code { text-transform: uppercase; letter-spacing: 8px; text-align: center; font-family: var(--pixel); font-size: 30px; }

  /* ---------- panels, buttons, fields ---------- */
  .panel {
    position: relative; background: linear-gradient(180deg, #2a1748, #180c2f); border: 4px solid var(--outline);
    box-shadow: inset 0 0 0 3px var(--line), 6px 6px 0 var(--outline); padding: 14px; min-width: 0;
  }
  .panel.red { box-shadow: inset 0 0 0 3px var(--red), 6px 6px 0 var(--outline); }
  .panel.blue { box-shadow: inset 0 0 0 3px var(--blue), 6px 6px 0 var(--outline); }
  .panel.gold { box-shadow: inset 0 0 0 3px var(--gold), 6px 6px 0 var(--outline); }
  .panel h3 { font-family: var(--pixel); font-size: 16.5px; color: var(--gold); margin: 0 0 12px; line-height: 1.5; text-transform: uppercase; }
  .panel p { margin: 0 0 12px; }

  .btn {
    font-family: var(--pixel); font-size: 16.5px; line-height: 1.3; text-transform: uppercase; color: var(--outline);
    padding: 13px 14px; border: 3px solid var(--outline); border-radius: 0; cursor: pointer;
    box-shadow: 0 6px 0 var(--outline); transition: transform .06s, box-shadow .06s, filter .15s; user-select: none;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.12); }
  .btn:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 var(--outline); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: 0 3px 0 var(--outline); }
  .btn.gold { background: var(--gold); }
  .btn.red { background: var(--red); color: #fff; }
  .btn.blue { background: var(--blue); color: #fff; }
  .btn.ghost { background: #2c1b4f; color: var(--cream); }
  .btn.small { font-size: 7.4px; padding: 10px 11px; }
  .btn.big { font-size: 10.7px; padding: 18px; width: 100%; }

  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > span { font-family: var(--pixel); font-size: 12px; color: var(--cream-d); text-transform: uppercase; line-height: 1.6; }
  .field.narrow { flex: 0 0 96px; }
  .field.check { flex-direction: row; align-items: center; gap: 10px; }
  .field.check > span { font-family: var(--body); font-size: 18px; text-transform: none; color: var(--cream); }
  .field.check input { width: 26px; height: 26px; accent-color: var(--gold); }
  input, select, textarea {
    font: inherit; font-size: 19.7px; color: var(--cream); background: #0c0717; border: 3px solid var(--outline);
    border-radius: 0; box-shadow: inset 0 0 0 2px var(--line); padding: 10px 12px; width: 100%; min-width: 0;
  }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; box-shadow: inset 0 0 0 2px var(--gold), 0 0 0 3px var(--gold); }
  select:disabled { opacity: .5; }

  .notice {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; width: 100%;
    background: var(--red); color: #fff; padding: 12px 14px; border: 3px solid var(--outline); box-shadow: 0 5px 0 var(--outline); font-size: 19.7px;
  }
  .notice .x { background: var(--outline); color: #fff; border: 0; width: 34px; height: 34px; font-size: 18px; cursor: pointer; flex: 0 0 34px; }

  /* ---------- chips / badges ---------- */
  .chip {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 6px 8px; background: #1b0f2e;
    border: 3px solid var(--outline); box-shadow: inset 0 0 0 2px var(--line); min-width: 0;
  }
  .chip.chip-red { box-shadow: inset 0 0 0 2px var(--red); }
  .chip.chip-blue { box-shadow: inset 0 0 0 2px var(--blue); }
  .chip.off { opacity: .55; }
  .chip .av {
    width: 32px; height: 32px; flex: 0 0 32px; display: grid; place-items: center; background: var(--gold); color: var(--outline);
    font-family: var(--pixel); font-size: 16.5px; border: 3px solid var(--outline);
  }
  .chip-red .av { background: var(--red); color: #fff; }
  .chip-blue .av { background: var(--blue); color: #fff; }
  .chip .nm { font-size: 18px; overflow-wrap: anywhere; flex: 1 1 auto; }
  .badge {
    font-family: var(--pixel); font-size: 10.5px; padding: 3px 5px; border: 2px solid var(--outline); background: var(--gold);
    color: var(--outline); white-space: nowrap;
  }
  .badge.host { background: var(--cream); }
  .badge.spy { background: var(--outline); color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
  .badge.rep { background: var(--purple); color: #fff; }
  .badge.you { align-self: flex-start; }
  .dot { width: 12px; height: 12px; border: 2px solid var(--outline); flex: 0 0 12px; margin-left: auto; }
  .dot.on { background: #5cff8a; box-shadow: 0 0 6px #5cff8a; }
  .dot.off { background: #666; }

  /* ---------- lobby ---------- */
  .lobby-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .eyebrow { font-family: var(--pixel); font-size: 13.5px; color: var(--cream-d); margin-bottom: 6px; }
  .room-code { font-family: var(--pixel); font-size: clamp(45px, 9vw, 90px); color: var(--gold); letter-spacing: 6px; text-shadow: 4px 4px 0 var(--red-d); line-height: 1.1; }
  .invite { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .invite .url { display: block; font-size: 16.4px; background: var(--outline); padding: 6px 8px; word-break: break-all; margin-top: 6px; }
  .lobby-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
  .lobby-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .lobby-side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 12px; }
  .teams { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .team-col { background: rgba(0,0,0,.35); border: 4px solid var(--outline); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .team-col.red { box-shadow: inset 0 0 0 3px var(--red); }
  .team-col.blue { box-shadow: inset 0 0 0 3px var(--blue); }
  .team-col.none { box-shadow: inset 0 0 0 3px var(--line); }
  .team-col h3 { font-family: var(--pixel); font-size: 15px; margin: 0; line-height: 1.6; }
  .team-col .list { display: flex; flex-direction: column; gap: 8px; }
  .team-col .btn { margin-top: auto; }
  .checklist { list-style: none; padding: 0; margin: 0 0 14px; display: flex; flex-direction: column; gap: 6px; font-size: 19.7px; }
  .checklist li.ok { color: #7dff9b; }
  .checklist li.todo { color: #ffb4a0; }
  .report { font-size: 18px; margin: 10px 0 0; }
  .words { margin-top: 16px; padding-top: 14px; border-top: 3px dashed var(--line); display: flex; flex-direction: column; gap: 8px; }
  .end { margin-top: 16px; padding-top: 14px; border-top: 3px dashed var(--line); align-items: flex-end; }

  /* ---------- game HUD ---------- */
  .game { gap: 14px; }
  .hud { display: flex; flex-direction: column; gap: 10px; }
  .hud-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1fr); gap: 10px; align-items: center; }
  .hud .center { text-align: center; min-width: 0; }
  .turn-tag {
    font-family: var(--pixel); font-size: clamp(13.5px, 2vw, 18px); line-height: 1.6; padding: 12px 10px;
    border: 3px solid var(--outline); background: var(--outline); color: var(--gold); box-shadow: 0 6px 0 var(--outline);
    animation: flash 1.6s steps(2) infinite;
  }
  .turn-tag.red { background: var(--red-d); color: #fff; }
  .turn-tag.blue { background: var(--blue-d); color: #fff; }
  @keyframes flash { 50% { filter: brightness(1.35); } }
  .turn-sub { font-size: 18px; color: var(--cream-d); margin-top: 6px; }
  .score {
    background: #1b0f2e; border: 4px solid var(--outline); padding: 10px 8px; text-align: center; min-width: 0;
    box-shadow: inset 0 0 0 3px var(--line), 0 6px 0 var(--outline); transition: transform .3s;
  }
  .score.red { box-shadow: inset 0 0 0 3px var(--red), 0 6px 0 var(--outline); }
  .score.blue { box-shadow: inset 0 0 0 3px var(--blue), 0 6px 0 var(--outline); }
  .score.active { transform: translateY(-4px); }
  .score.red.active { animation: glow-red 1.1s ease-in-out infinite alternate; }
  .score.blue.active { animation: glow-blue 1.1s ease-in-out infinite alternate; }
  @keyframes glow-red { to { box-shadow: inset 0 0 0 3px var(--red), 0 0 26px 4px var(--red), 0 6px 0 var(--outline); } }
  @keyframes glow-blue { to { box-shadow: inset 0 0 0 3px var(--blue), 0 0 26px 4px var(--blue), 0 6px 0 var(--outline); } }
  .score .sn { font-family: var(--pixel); font-size: 12px; color: var(--cream-d); line-height: 1.6; }
  .score .sv { font-family: var(--pixel); font-size: clamp(39px, 6vw, 69px); color: var(--gold); text-shadow: 3px 3px 0 var(--outline); margin: 6px 0 2px; }
  .score .ss { font-size: 16.4px; color: var(--cream-d); }
  .score .spy { margin-top: 6px; font-size: 16.4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clue {
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 12px;
    background: var(--cream); color: #1a0f0a; border: 4px solid var(--outline); box-shadow: 0 6px 0 var(--outline); padding: 10px 16px;
  }
  .clue.red { box-shadow: inset 0 -8px 0 var(--red), 0 6px 0 var(--outline); }
  .clue.blue { box-shadow: inset 0 -8px 0 var(--blue), 0 6px 0 var(--outline); }
  .clue .lbl { font-family: var(--pixel); font-size: 13.5px; background: var(--outline); color: var(--gold); padding: 8px; }
  .clue .cw { font-size: clamp(24.6px, 6vw, 37.7px); line-height: 1; overflow-wrap: anywhere; }
  .clue .num { font-family: var(--pixel); font-size: 24px; width: 44px; height: 44px; display: grid; place-items: center; background: var(--red); color: #fff; border: 3px solid var(--outline); }
  .clue.blue .num { background: var(--blue); }
  .clue .gs { font-size: 18px; }
  .timer { position: relative; height: 30px; background: var(--outline); border: 3px solid var(--outline); box-shadow: inset 0 0 0 2px var(--line); }
  .timer .bar { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; background: repeating-linear-gradient(90deg, var(--blue) 0 10px, var(--gold) 10px 14px); transition: width .25s linear; }
  .timer span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-family: var(--pixel); font-size: 15px; color: #fff; text-shadow: 2px 2px 0 var(--outline); }
  .guide { text-align: center; font-size: 19.7px; line-height: 1.3; background: rgba(0,0,0,.4); padding: 8px 12px; border: 2px dashed var(--line); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .clue-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.35); padding: 12px; border: 3px solid var(--gold); }
  .clue-form .field { flex: 1 1 200px; }
  .feed { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  .feed li { font-size: 17.2px; padding: 5px 8px; border-left: 4px solid var(--line); background: rgba(0,0,0,.25); overflow-wrap: anywhere; }
  .feed li.good { border-left-color: #5cff8a; }
  .feed li.bad { border-left-color: var(--red); color: #ffc2cc; }
  .feed li.gold { border-left-color: var(--gold); color: var(--gold); }
  .feed li.turn { border-left-color: var(--purple); color: #e3d1ff; }
  .feed li.clue { border-left-color: var(--cream); }
  .feed li.muted { color: var(--cream-d); }

  /* ---------- board ---------- */
  .board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(6px, 1.4vw, 14px); perspective: 1000px; padding: 6px; }
  .card {
    position: relative; aspect-ratio: 5 / 3.4; min-width: 0; padding: 0; border: 0; background: none; cursor: default;
    transform: rotate(var(--tilt, 0deg)); transition: transform .2s cubic-bezier(.3,1.4,.5,1), filter .2s;
  }
  .card.selectable { cursor: pointer; }
  .card.selectable:hover, .card.selectable:focus-visible { transform: translateY(-7px) rotate(0deg) scale(1.03); filter: brightness(1.08); }
  .card.selectable:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .card:active.selectable { transform: translateY(-2px) scale(.98); }
  .card .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3,1.2,.5,1); }
  .card.revealed .inner { transform: rotateY(180deg); }
  .card .face {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: clamp(4px, 1vw, 10px); border: 4px solid var(--outline); box-shadow: inset 0 0 0 3px rgba(0,0,0,.12), 0 6px 0 var(--outline);
    backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden;
  }
  .card .front { background: radial-gradient(circle at 25% 15%, #fffaf0, transparent 55%), linear-gradient(180deg, #f6ead2, #e6d3a8); color: #1a0f0a; }
  .card .back { transform: rotateY(180deg); color: #fff; }
  .card .back.face-red { background: linear-gradient(180deg, #ff7a4d, #c93a12); }
  .card .back.face-blue { background: linear-gradient(180deg, #4db3ee, #14649e); }
  .card .back.face-neutral { background: linear-gradient(180deg, #d9c39a, #b9a376); color: #1a0f0a; }
  .card .back.face-assassin { background: repeating-linear-gradient(0deg, rgba(255,46,77,.25) 0 2px, transparent 2px 5px), #05010a; color: var(--red); animation: glitch-bg 1.2s steps(3) 2; }
  .card .w { font-family: var(--body); font-size: clamp(11.5px, 3.4vw, 21.3px); line-height: .95; text-align: center; overflow-wrap: normal; hyphens: auto; position: relative; z-index: 1; }
  .card .tag { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-family: var(--pixel); font-size: 10.5px; opacity: .9; }
  .card.peek-red .front { box-shadow: inset 0 -12px 0 var(--red), 0 6px 0 var(--outline); }
  .card.peek-blue .front { box-shadow: inset 0 -12px 0 var(--blue), 0 6px 0 var(--outline); }
  .card.peek-neutral .front { box-shadow: inset 0 -12px 0 #8a7448, 0 6px 0 var(--outline); }
  .card.peek-assassin .front { box-shadow: inset 0 -12px 0 var(--outline), inset 0 0 0 3px var(--red), 0 6px 0 var(--outline); }
  .card.mine .front { box-shadow: inset 0 0 0 4px var(--blue), 0 0 0 3px var(--gold), 0 6px 0 var(--outline); }
  .card.pending { animation: pulse 0.6s steps(2) infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--gold); } }
  .card.tie .front { outline: 3px dashed var(--gold); outline-offset: 4px; }
  .card.last .face { filter: brightness(1.12); }
  .card.revealed { animation: impact .35s steps(4); }
  @keyframes impact { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .card .voters { position: absolute; left: 4px; bottom: -12px; display: flex; gap: 2px; z-index: 3; }
  .card .voters span { width: 20px; height: 20px; display: grid; place-items: center; background: var(--gold); color: var(--outline); font-family: var(--pixel); font-size: 12px; border: 2px solid var(--outline); }
  .card .glitch { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--body); font-size: clamp(11.5px, 3.4vw, 21.3px); color: var(--blue); clip-path: inset(38% 0 42% 0); animation: glitch-text .4s steps(2) infinite; }
  @keyframes glitch-text {
    0% { transform: translate(-3px, 0); clip-path: inset(10% 0 70% 0); }
    50% { transform: translate(3px, 0); clip-path: inset(60% 0 10% 0); }
    100% { transform: translate(0, 0); clip-path: inset(30% 0 40% 0); }
  }
  @keyframes glitch-bg {
    0%, 100% { filter: none; transform: translate(0); }
    33% { filter: hue-rotate(90deg) contrast(1.6); transform: translate(-2px, 1px); }
    66% { filter: invert(1) contrast(2); transform: translate(2px, -1px); }
  }

  /* ---------- overlay / effects ---------- */
  .overlay { position: fixed; inset: 0; z-index: 55; display: grid; place-items: center; padding: 16px; background: rgba(8,4,16,.78); }

  .toast { background: var(--cream); color: var(--outline); border: 3px solid var(--outline); box-shadow: 0 5px 0 var(--outline); padding: 10px 14px; font-size: 18px; animation: pop .25s steps(4) both; }
  .toast.error { background: var(--red); color: #fff; }
  @keyframes pop { 0% { transform: scale(.85) translateY(10px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
  .fx { position: fixed; inset: 0; pointer-events: none; z-index: 45; overflow: hidden; }
  .chip-fx { position: fixed; width: 11px; height: 11px; border: 2px solid var(--outline); animation: burst .8s steps(6) forwards; }
  @keyframes burst { to { transform: translate(var(--dx), var(--dy)) rotate(180deg); opacity: 0; } }
  .confetti { position: fixed; top: -24px; width: 12px; height: 16px; border: 2px solid var(--outline); animation: fall 3.6s linear forwards; }
  @keyframes fall { to { transform: translateY(112vh) rotate(var(--spin)); } }
  .glitch-screen { position: fixed; inset: 0; z-index: 46; display: grid; place-items: center; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,46,77,.18) 0 2px, transparent 2px 6px), rgba(0,0,0,.6); animation: flash-out 1.4s steps(4) forwards; }
  .glitch-screen span { font-family: var(--pixel); font-size: clamp(24px, 5vw, 57px); color: var(--red); text-shadow: 4px 0 var(--blue), -4px 0 var(--gold); animation: glitch-text .3s steps(2) infinite; text-align: center; padding: 0 16px; }
  @keyframes flash-out { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
  .combo-text { position: fixed; top: 28%; left: 50%; z-index: 47; font-family: var(--pixel); font-size: clamp(27px, 6vw, 63px); color: var(--gold); text-shadow: 4px 4px 0 var(--red-d), -3px 0 0 var(--blue), 0 8px 0 var(--outline); white-space: nowrap; pointer-events: none; animation: combo 1.5s steps(8) forwards; transform: translate(-50%, -50%); }
  @keyframes combo { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; } 25% { transform: translate(-50%, -50%) scale(1); } 85% { opacity: 1; } 100% { transform: translate(-50%, -62%) scale(1); opacity: 0; } }
  body.shaking .screen { will-change: transform; }

  /* ---------- telas estreitas ---------- */
  @media (max-width: 900px) {
    .lobby-grid { grid-template-columns: 1fr; }
    .lobby-side { position: static; }
  }

    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }

  /* ================= ERA ESPACIAL (anos 60 / Jetsons) ================= */

  #bg svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .overlay { background: rgba(28,43,74,.72); }

  .ov-card.red { box-shadow: 0 0 0 4px var(--red), 10px 10px 0 var(--outline); }
  .ov-card.blue { box-shadow: 0 0 0 4px var(--blue), 10px 10px 0 var(--outline); }
  .ov-card h2 { color: var(--red); -webkit-text-stroke: 2px var(--outline); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--outline); }

  .card .face { border-radius: 16px; box-shadow: inset 0 0 0 3px rgba(28,43,74,.12), 0 5px 0 var(--outline); }

  /* ================= CODINONGOS: vibe pixel ================= */
  html, body { font-size: 17px; letter-spacing: .01em; }
  *, *::before, *::after { border-radius: 0 !important; }
  #bg { width: 100%; height: 100%; object-fit: cover; object-position: bottom; image-rendering: pixelated; background: #7fd3e0; }
  #bg::before { display: none; }

  .btn, .badge, .status, .turn-tag, .timer { border-radius: 0; }

  .btn:active:not(:disabled) { box-shadow: 0 1px 0 var(--outline), inset 0 -2px 0 rgba(0,0,0,.18); }
  .ov-card h2 { -webkit-text-stroke: 0; text-shadow: 4px 0 0 var(--outline), -4px 0 0 var(--outline), 0 4px 0 var(--outline), 0 -4px 0 var(--outline), 6px 6px 0 var(--outline); }

  /* ================= Brilho, degradês e efeitos ================= */
  #glow { position: fixed; inset: 0; z-index: -1; pointer-events: none; background:
    radial-gradient(60% 50% at 12% 18%, rgba(232,57,138,.30), transparent 70%),
    radial-gradient(55% 45% at 88% 22%, rgba(255,184,28,.34), transparent 70%),

  #sparks { position: fixed; left: 0; top: 0; width: 5px; height: 5px; z-index: 0; pointer-events: none; background: #fff;
    box-shadow: 8vw 70vh #fff, 18vw 95vh #ffb81c, 27vw 60vh #fff, 38vw 105vh #e8398a, 47vw 80vh #fff, 58vw 100vh #ffb81c, 66vw 65vh #fff, 75vw 90vh #1f8fd1, 84vw 75vh #fff, 93vw 110vh #e8398a, 13vw 40vh #1f8fd1, 52vw 35vh #fff, 88vw 30vh #ffb81c;
    animation: rise 10s steps(40) infinite; }

  body::after { content: ''; position: fixed; inset: 0; z-index: 49; pointer-events: none; background: radial-gradient(ellipse at center, transparent 62%, rgba(28,43,74,.28) 100%); }
  .panel { background: linear-gradient(160deg, #fff 0%, #f3fbf8 45%, #d9f3ec 100%); }
  .panel.red { background: linear-gradient(160deg, #fff 0%, #ffece3 55%, #ffcfbc 100%); }
  .panel.blue { background: linear-gradient(160deg, #fff 0%, #e6f5ff 55%, #bfe3fa 100%); }
  .panel.gold { background: linear-gradient(160deg, #fff 0%, #fff7dc 55%, #ffe59a 100%); }
  .team-col, .chip, .score { background: linear-gradient(180deg, #fff, #e8f6f2); }
  .ov-card { background: linear-gradient(170deg, #fff, #eafaf5 55%, #ffe9b8); }
  .tagline { background: linear-gradient(90deg, #fff, #e3fbff 50%, #fff4d6); }
  .btn.gold { background: linear-gradient(180deg, #ffd96b, #ffb81c 55%, #f09a00); }
  .btn.red { background: linear-gradient(180deg, #ff8458, #f2542d 55%, #c93a12); }
  .btn.blue { background: linear-gradient(180deg, #5cbcf2, #1f8fd1 55%, #14649e); }

  .btn { position: relative; overflow: hidden; }
  .btn::after { content: ''; position: absolute; inset: 0; pointer-events: none; transform: translateX(-130%); background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.65) 50%, transparent 62%); }
  .btn:hover:not(:disabled)::after { transform: translateX(130%); transition: transform .55s steps(9); }
  .turn-tag { background: linear-gradient(180deg, #2c3f66, #1c2b4a); }
  .turn-tag.red { background: linear-gradient(180deg, #e5562a, #a8280e); }
  .turn-tag.blue { background: linear-gradient(180deg, #2b9be0, #0b4f86); }
  .clue { background: linear-gradient(180deg, #fffaf0, #ffe9b8); }
  .card .front { background: radial-gradient(circle at 25% 15%, #fff, transparent 55%), linear-gradient(180deg, #fff6e0, #f1d9a4); }
  .card.selectable:hover .face { box-shadow: inset 0 0 0 3px rgba(28,43,74,.12), 0 5px 0 var(--outline), 0 0 18px 2px rgba(255,184,28,.85); }
  .card .back.face-red { background: linear-gradient(180deg, #ff8d5f, #f2542d 50%, #b8300d); }

  .room-code { background: linear-gradient(180deg, #ffb81c, #f2542d 60%, #e8398a); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; filter: drop-shadow(4px 4px 0 var(--outline)); text-shadow: none; }
  .brand-face { animation: facebob 1.2s steps(2) infinite, facepulse 3s steps(6) infinite; }
  @keyframes facepulse { 50% { filter: drop-shadow(5px 5px 0 var(--outline)) drop-shadow(0 0 12px rgba(255,184,28,.95)); } }
  .logo svg { animation: logoglow 2.6s steps(6) infinite alternate; }

  /* ================= Chat ================= */
  #chat { position: fixed; left: 12px; bottom: 12px; z-index: 65; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  #chat-badge { margin-left: 8px; padding: 0 6px; background: var(--red); color: #fff; border: 2px solid var(--outline); }

<script>
(() => {
  'use strict';

  // ============ utilidades ============
  const $ = (sel) => document.querySelector(sel);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hex = (n) => {
    const b = new Uint8Array(n);
    crypto.getRandomValues(b);
    return Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
  };
  const TEAM_NAME = { red: 'Vermelha', blue: 'Azul' };
  const TEAM_UPPER = { red: 'VERMELHA', blue: 'AZUL' };
  const IDENT_TAG = { red: 'VERMELHA', blue: 'AZUL', neutral: 'INOCENTE', assassin: '☠ ASSASSINO' };
  const PHASE_TEXT = { clue: 'aguardando dica', guessing: 'palpites', tiebreak: 'desempate', over: 'fim de jogo' };
  const EV_CLASS = { correct: 'good', wrong: 'bad', assassin: 'bad', win: 'gold', neutral: 'muted', turn: 'turn', turnEnd: 'muted', clue: 'clue', tie: 'gold', join: 'muted', leave: 'muted' };
  // Página servida pelo próprio servidor: ele é o servidor de jogo (evita endereço antigo guardado, p. ex. após troca de IP).
  // Hospedada no Neocities (ou outro site estático) a página não é o servidor de jogo: o endereço vem do link (?servidor=) ou do campo "Servidor".
  const STATIC_HOST = /\.neocities\.org$/i.test(location.hostname);
  const PAGE_URL = location.origin + location.pathname;
  const URL_SERVER = (() => { const v = (new URLSearchParams(location.search).get('servidor') || '').trim().replace(/\/+$/, ''); return /^https?:\/\/[^\s<>"']+$/i.test(v) ? v : ''; })();
  const PAGE_IS_HTTP = location.protocol.startsWith('http') && !STATIC_HOST;
  // Endereço fixo do servidor online (ex.: https://codinongos.onrender.com). Preencha depois de publicar o servidor.
  const PROD_SERVER = '';
  const DEFAULT_SERVER = PAGE_IS_HTTP ? location.origin : (STATIC_HOST && PROD_SERVER ? PROD_SERVER : 'http://localhost:3000');

  // Pacote de palavras ácidas (palavrão + humor ácido), enviado ao servidor pelo botão do anfitrião.
  const ACID = 'porra caralho merda bosta foda cu buceta puta corno babaca otário trouxa idiota cretino pau rola punheta tesão trepada bunda peido cagada mijo escroto vagabundo desgraça cacete arrombado cuzão porrada putaria sacanagem safado tarado rabo teta pentelho orgia vibrador camisinha motel chifre bundão cornudo fodido piranha galinha gemido calcinha sutiã cueca boleto ressaca sogra cunhado síndico vizinho coach influencer empreendedor pirâmide golpe fiado calote cheque penhora pix inss detran cartório fila convênio dentista terapia psicólogo remédio ansiedade cachaça pinga cerveja buteco farofa churrasco tiozão fofoca crush fantasma casamento divórcio pensão herança velório caixão coveiro cemitério lápide testamento dengue mosquito barata rato pombo gambá urubu chorume esgoto lixão enchente apagão gambiarra latrina privada bidê propina laranja lavagem mala delação pilantra tigrinho aposta fatura juros salário estágio reunião chefe demissão férias segunda domingo imposto leão carnaval novela zap áudio meme stories sertanejo pagode funk forró foguete marciano alienígena astronauta satélite sputnik cometa buraco robô laser átomo bomba nuclear radiação cápsula órbita eclipse lua saturno marte jetpack disco pílula hippie twist minissaia fusca baseado maconha fumaça paz flor bigode vitrola televisor antena radar abdução sonda gravidade vácuo estrela sol universo galáxia ovni invasão banco cobra ponta coroa planta vela pena cabo manga carta banda vaca cachorro galo coelho égua jumento burro porco urso macaco mico sapo lesma gato abelha ferrão presunto salsicha linguiça pepino banana berinjela espeto chicote algema corda grampo escuta veneno faca soco tapa tiro bala cobertor lençol colchão cama'.split(/\s+/).filter(Boolean);


  // ============ marca pixelada (logo vetorial em grade 5x7, não depende de fonte) ============
  const GLYPH = {
    C: ['.####','#....','#....','#....','#....','#....','.####'],
    O: ['.###.','#...#','#...#','#...#','#...#','#...#','.###.'],
    D: ['####.','#...#','#...#','#...#','#...#','#...#','####.'],
    I: ['#####','..#..','..#..','..#..','..#..','..#..','#####'],
    N: ['#...#','##..#','##..#','#.#.#','#..##','#..##','#...#'],
    G: ['.####','#....','#....','#.###','#...#','#...#','.###.'],
    S: ['.####','#....','#....','.###.','....#','....#','####.'],
  };
  function pixelLine(word, fill, shade) {
    const cells = [];
    [...word].forEach((ch, i) => GLYPH[ch].forEach((row, y) => [...row].forEach((c, x) => { if (c === '#') cells.push([i * 6 + x, y]); })));
    const w = word.length * 6 - 1;
    const rect = (x, y, col) => `<rect x="${x}" y="${y}" width="1" height="1" fill="${col}"/>`;
    const out = [], sh = [], main = [];
    for (const [x, y] of cells) {
      for (const [dx, dy] of [[2,2],[1,2],[2,1]]) out.push(rect(x + dx, y + dy, '#1c2b4a'));
      sh.push(rect(x, y + 1, shade));
      main.push(rect(x, y, fill));
    }
    return { w: w + 2, h: 10, svg: out.join('') + sh.join('') + main.join('') };
  }
  function logoHtml() {
    const a = pixelLine('CODI', '#f2542d', '#a8280e');
    const b = pixelLine('NONGOS', '#ffffff', '#1f8fd1');
    const W = b.w, H = a.h + b.h - 1;
    return `<h1 class="logo" aria-label="CODINONGOS"><svg viewBox="0 0 ${W} ${H}" role="img" aria-hidden="true">`
      + `<g transform="translate(${Math.floor((W - a.w) / 2)} 0)">${a.svg}</g>`
      + `<g transform="translate(0 ${a.h - 1})">${b.svg}</g></svg></h1>`;
  }

  // ============ fundo em pixel art (canvas 192x108, ampliado sem suavização) ============
  function drawBg() {
    const cv = document.getElementById('bg'); if (!cv) return;
    const g = cv.getContext('2d'); const W = 192;
    const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
    const sky = ['#04061a', '#080b26', '#0d1134', '#141645', '#1d1a56', '#2c1f63', '#43266c', '#64327a'];
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const stars = Array.from({ length: 46 }, () => [Math.floor(rnd() * W), Math.floor(rnd() * 72), rnd() < .15 ? '#ffd96b' : '#ffffff']);
    const cloud = (x, y) => { R(x + 4, y, 14, 3, '#241f52'); R(x, y + 3, 24, 4, '#241f52'); R(x + 6, y + 7, 12, 1, '#1a1744'); };
    const ufo = (x, y) => { R(x + 6, y, 8, 3, '#7fe3ff'); R(x + 4, y + 2, 12, 1, '#7fe3ff'); R(x, y + 3, 20, 3, '#f2542d'); R(x + 2, y + 6, 16, 1, '#a8280e'); R(x + 4, y + 4, 2, 1, '#ffd96b'); R(x + 9, y + 4, 2, 1, '#ffd96b'); R(x + 14, y + 4, 2, 1, '#ffd96b'); };
    const bld = (x, w, top, c) => { R(x, top, w, 96 - top, c); for (let yy = top + 3; yy < 93; yy += 5) for (let xx = x + 2; xx < x + w - 2; xx += 4) if (((xx * 7 + yy * 3) % 5) < 2) R(xx, yy, 2, 2, '#ffd96b'); };
    const frame = (t) => {
      sky.forEach((c, i) => R(0, i * 14, W, 15, c));
      stars.forEach(([x, y, c], i) => { if (((t + i) >> 2) % 3) R(x, y, 1, 1, c); });
      R(162, 11, 7, 9, '#f4ecd0'); R(160, 13, 11, 5, '#f4ecd0'); R(165, 13, 2, 2, '#d8cca4');
      cloud(10 + (t % 60), 24); cloud(120 - (t % 40), 14);
      [[4, 18, 66, '#101433'], [24, 12, 52, '#151a3c'], [40, 16, 72, '#101433'], [60, 10, 60, '#171c40'], [74, 20, 76, '#101433'], [98, 14, 58, '#151a3c'], [116, 18, 70, '#101433'], [138, 12, 50, '#171c40'], [154, 16, 64, '#101433'], [174, 18, 74, '#151a3c']].forEach((b) => bld(...b));
      R(30, 46, 1, 6, '#2a2f66'); if ((t >> 1) % 2) R(30, 45, 1, 1, '#ff5a3c');
      R(0, 96, W, 12, '#0a1a2b'); R(0, 96, W, 1, '#1f3a5a');
      ufo(112, 36 + (((t >> 1) % 2) ? 0 : 2)); ufo(14, 58 + (((t >> 1) % 3) ? 1 : 0) * 2);
    };
    let t = 0; frame(0);
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(() => { t++; frame(t); }, 220);
  }
  drawBg();

  // ============ armazenamento local (só sessão e preferências) ============
  const STORE_KEY = 'codinongos-html:v1';
  const stored = () => {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch { return {}; }
  };
  const remember = (patch) => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ ...stored(), ...patch })); } catch { /* sem armazenamento: segue sem lembrar */ }
  };

  // ============ estado ============
  const S = {
    server: URL_SERVER || (PAGE_IS_HTTP || (STATIC_HOST && PROD_SERVER) ? DEFAULT_SERVER : stored().server || DEFAULT_SERVER),
    socket: null,
    view: null,
    receivedAt: 0,
    draft: {},        // valores de campos (sobrevivem às re-renderizações)
    notice: '',
    report: null,     // último relatório de importação de palavras
    overlayHidden: false,
    lastEventId: null,
    combo: 0,
    fx: [],
    pendingKey: null,
    muted: !!stored().muted,
    lan: null,
    lanChecked: false,
    myTurn: false,
  };
  S.draft.nick = stored().nick || '';
  S.draft.server = S.server;
  S.draft.code = (new URLSearchParams(location.search).get('sala') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);

  // ============ som sintetizado (sem arquivos) ============
  let audioCtx = null;
  const audio = () => {
    if (!audioCtx) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      audioCtx = new Ctor();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  };
  // [frequência, início, duração, tipo, volume, frequência final opcional]
  const NOTES = {
    click: [[880, 0, 0.05, 'sine', 0.08]],
    clue: [[523, 0, 0.1, 'triangle', 0.2], [784, 0.09, 0.14, 'triangle', 0.2]],
    turn: [[392, 0, 0.12, 'sine', 0.12], [587, 0.12, 0.12, 'sine', 0.12], [784, 0.24, 0.2, 'sine', 0.14]],
    myturn: [[659, 0, 0.14, 'triangle', 0.32], [880, 0.15, 0.14, 'triangle', 0.32], [1175, 0.3, 0.14, 'triangle', 0.32], [880, 0.5, 0.14, 'triangle', 0.32], [1175, 0.65, 0.3, 'triangle', 0.34]],
    correct: [[660, 0, 0.12], [830, 0.07, 0.12], [990, 0.14, 0.12], [1320, 0.21, 0.12]],
    wrong: [[360, 0, 0.35, 'sawtooth', 0.2, 90]],
    neutral: [[300, 0, 0.18, 'triangle', 0.16]],
    join: [[740, 0, 0.12, 'triangle', 0.18, 1040]],
    leave: [[520, 0, 0.14, 'triangle', 0.16, 260]],
    tie: [[600, 0, 0.1, 'sine', 0.12], [600, 0.14, 0.1, 'sine', 0.12]],
    win: [[523, 0, 0.2], [659, 0.11, 0.2], [784, 0.22, 0.2], [1047, 0.33, 0.2], [784, 0.44, 0.2], [1047, 0.55, 0.2], [1319, 0.66, 0.3]],
    lose: [[392, 0, 0.25, 'triangle', 0.18], [349, 0.18, 0.25, 'triangle', 0.18], [311, 0.36, 0.25, 'triangle', 0.18], [262, 0.54, 0.3, 'triangle', 0.18]],
    assassin: [[220, 0, 0.9, 'sawtooth', 0.25, 30], [55, 0.5, 0.6, 'sine', 0.2]],
  };
  const SOUND_FOR = {
    join: 'join', host: 'join', leave: 'leave', team: 'click', clue: 'clue', turn: 'turn', start: 'turn',
    correct: 'correct', wrong: 'wrong', neutral: 'neutral', assassin: 'assassin', tie: 'tie', vote: 'click',
  };
  function sfx(name) {
    if (S.muted) return;
    const c = audio();
    if (!c) return;
    const now = c.currentTime;
    for (const [freq, start, dur, type = 'sine', gain = 0.14, slide] of NOTES[name] || []) {
      const o = c.createOscillator();
      const g = c.createGain();
      const t0 = now + start;
      o.type = type;
      o.frequency.setValueAtTime(freq, t0);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(c.destination);
      o.start(t0);
      o.stop(t0 + dur + 0.02);
    }
    if (name === 'assassin') {
      const buf = c.createBuffer(1, c.sampleRate * 0.6, c.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = c.createBufferSource();
      const g = c.createGain();
      src.buffer = buf;
      g.gain.setValueAtTime(0.4, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
      src.connect(g).connect(c.destination);
      src.start(now);
    }
  }

  // ============ efeitos visuais ============
  function burst(index, team) {
    const card = document.querySelector(`[data-card="${index}"]`);
    if (!card) return;
    const r = card.getBoundingClientRect();
    const color = team === 'red' ? '#f2542d' : team === 'blue' ? '#1f8fd1' : '#ffb81c';
    for (let i = 0; i < 14; i++) {
      const p = document.createElement('span');
      const a = Math.random() * Math.PI * 2;
      const s = 40 + Math.random() * 90;
      p.className = 'chip-fx';
      p.style.cssText = `left:${r.left + r.width / 2}px;top:${r.top + r.height / 2}px;background:${color};--dx:${Math.cos(a) * s}px;--dy:${Math.sin(a) * s}px`;
      $('#fx').appendChild(p);
      setTimeout(() => p.remove(), 900);
    }
  }
  function shake() {
    document.body.classList.remove('shaking');
    void document.body.offsetWidth;
    document.body.classList.add('shaking');
    setTimeout(() => document.body.classList.remove('shaking'), 450);
  }
  function glitch() {
    const g = document.createElement('div');
    g.className = 'glitch-screen';
    g.innerHTML = '<span>ASSASSINO REVELADO</span>';
    document.body.appendChild(g);
    setTimeout(() => g.remove(), 1400);
  }
  function comboText(n) {
    const el = document.createElement('div');
    el.className = 'combo-text';
    el.textContent = `COMBO ×${n}!`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1500);
  }
  function confetti(team) {
    const color = team === 'red' ? '#f2542d' : team === 'blue' ? '#1f8fd1' : null;
    const palette = ['#f2542d', '#1f8fd1', '#ffb81c', '#e8398a'];
    for (let i = 0; i < 70; i++) {
      const p = document.createElement('span');
      p.className = 'confetti';
      p.style.cssText = `left:${Math.random() * 100}%;background:${color || palette[i % 4]};animation-delay:${Math.random() * 0.8}s;--spin:${Math.random() * 720 - 360}deg`;
      $('#fx').appendChild(p);
      setTimeout(() => p.remove(), 4300);
    }
  }
  function flushFx() {
    const queue = S.fx;
    S.fx = [];
    for (const f of queue) {
      if (f.kind === 'particles') burst(f.index, f.team);
      else if (f.kind === 'shake') shake();
      else if (f.kind === 'glitch') glitch();
      else if (f.kind === 'combo') comboText(f.count);
      else if (f.kind === 'confetti') confetti(f.team);
    }
  }

  // O fundo é pixel art desenhada em canvas (ver drawBg).
  function startBackground() {}

  // ============ conexão com o servidor ============
  function setConn(state, message) {
    const status = $('#status');
    const bar = $('#conn');
    const labels = { online: ['● conectado', 'ok'], connecting: ['● conectando…', 'wait'], offline: ['● sem conexão', 'bad'] };
    status.textContent = labels[state][0];
    status.className = `status ${labels[state][1]}`;
    if (state === 'online') {
      bar.hidden = true;
    } else {
      bar.hidden = false;
      bar.textContent = message || (state === 'offline'
        ? 'Conexão perdida. Tentando reconectar… Sua vaga na sala está guardada.'
        : 'Reconectando ao servidor…');
    }
  }

  function connect() {
    if (typeof io === 'undefined') {
      setConn('offline', 'A biblioteca de conexão não carregou. Verifique a internet e recarregue a página.');
      return;
    }
    if (S.socket) {
      S.socket.removeAllListeners();
      S.socket.disconnect();
    }
    S.server = (S.draft.server || DEFAULT_SERVER).trim().replace(/\/+$/, '');
    // Página https não consegue falar com servidor http da rede local (o navegador bloqueia): só localhost é liberado.
    if (location.protocol === 'https:' && /^http:\/\//i.test(S.server) && !/^http:\/\/(localhost|127\.0\.0\.1)([:/]|$)/i.test(S.server)) {
      setConn('offline', 'Esta página usa https e só conecta em servidor https (use um túnel, como o cloudflared). Endereços http://IP da rede local são bloqueados pelo navegador.');
      return;
    }
    remember({ server: S.server });
    S.lan = null;
    S.lanChecked = false;
    setConn('connecting');

    const socket = io(S.server, { transports: ['websocket', 'polling'], reconnectionDelayMax: 4000 });
    S.socket = socket;
    socket.on('connect', () => {
      setConn('online');
      restoreSession();
    });
    socket.on('disconnect', () => setConn('offline'));
    socket.on('connect_error', () => setConn('offline'));
    socket.io.on('reconnect_attempt', () => setConn('connecting'));
    socket.on('state', onState);
    socket.on('room:closed', (payload) => {
      leaveLocal();
      S.notice = payload && payload.reason === 'host' ? 'O anfitrião encerrou a sala.'
        : payload && payload.reason === 'idle' ? 'A sala foi encerrada por inatividade.'
        : 'A sala foi encerrada.';
      render();
    });
    socket.on('session:replaced', () => {
      leaveLocal();
      S.notice = 'Esta sessão foi aberta em outra aba ou dispositivo. Entre de novo para continuar aqui.';
      render();
    });
  }

  function leaveLocal() {
    remember({ code: undefined });
    S.view = null;
    S.lastEventId = null;
    S.myTurn = false;
    S.report = null;
  }

  async function restoreSession() {
    const s = stored();
    if (!s.code || !s.token || !s.nick) return;
    const ack = await act('room:join', { code: s.code, nick: s.nick, token: s.token });
    if (!ack.ok && ack.code === 'NOT_FOUND') {
      leaveLocal();
      S.notice = 'Essa sala não existe mais. Ela pode ter sido encerrada.';
      render();
    }
  }

  /** Envia uma ação ao servidor e devolve o ack (com reqId para evitar execução dupla). */
  function act(event, payload = {}) {
    return new Promise((resolve) => {
      const socket = S.socket;
      if (!socket || !socket.connected) {
        resolve({ ok: false, code: 'OFFLINE', error: 'Sem conexão com o servidor. Tentando reconectar…' });
        return;
      }
      const timer = setTimeout(() => resolve({ ok: false, code: 'TIMEOUT', error: 'O servidor demorou para responder. Tente de novo.' }), 8000);
      socket.emit(event, { ...payload, reqId: hex(10) }, (ack) => {
        clearTimeout(timer);
        resolve(ack || { ok: false, error: 'Resposta inesperada do servidor.' });
      });
    });
  }

  async function run(event, payload, okMessage) {
    const ack = await act(event, payload);
    if (!ack.ok) toast(ack.error || 'Não foi possível concluir.', 'error');
    else if (okMessage) toast(okMessage);
    return ack;
  }

  function onState(view) {
    const wasMyTurn = S.myTurn;
    S.myTurn = isMyTurn(view);
    S.view = view;
    S.receivedAt = Date.now();
    if (!view.game || view.game.phase !== 'over') S.overlayHidden = false;
    collectFx(view, S.myTurn && !wasMyTurn);
    render();
  }

  // Transforma eventos públicos em som e efeito. O primeiro carregamento só marca o ponto de partida.
  function collectFx(view, alertMyTurn) {
    const events = view.events || [];
    const newest = events.length ? events[events.length - 1].id : 0;
    if (S.lastEventId === null) {
      S.lastEventId = newest;
      return;
    }
    const fresh = events.filter((e) => e.id > S.lastEventId);
    S.lastEventId = newest;
    for (const ev of fresh) {
      const snd = SOUND_FOR[ev.type];
      if (snd && !(alertMyTurn && (ev.type === 'turn' || ev.type === 'clue'))) sfx(snd);
      if (ev.type === 'turn') S.combo = 0;
      if (ev.type === 'correct') {
        S.combo += 1;
        S.fx.push({ kind: 'particles', index: ev.index, team: ev.team });
        if (S.combo >= 2) S.fx.push({ kind: 'combo', count: S.combo });
      }
      if (ev.type === 'wrong') S.fx.push({ kind: 'shake' });
      if (ev.type === 'assassin') S.fx.push({ kind: 'glitch' });
      if (ev.type === 'win') {
        const youWon = !view.you || !view.you.team || view.you.team === ev.team;
        S.fx.push({ kind: 'confetti', team: youWon ? ev.team : null });
        sfx(youWon ? 'win' : 'lose');
      }
    }
    if (alertMyTurn) notifyMyTurn(view);
  }

  // ============ aviso de "sua vez" ============
  const BASE_TITLE = document.title;
  let titleTimer = null;
  function stopTitleFlash() {
    if (titleTimer) { clearInterval(titleTimer); titleTimer = null; }
    document.title = BASE_TITLE;
  }
  function askNotify() {
    try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch { /* sem notificação do sistema */ }
  }
  // É a vez de agir? Mestre Espião na fase da dica; integrantes da equipe nos palpites.
  function isMyTurn(v) {
    const g = v && v.game, y = v && v.you;
    if (!g || !y || g.phase === 'over' || !y.team || y.team !== g.activeTeam) return false;
    return g.phase === 'clue' ? !!y.isSpymaster : !y.isSpymaster;
  }
  function notifyMyTurn(v) {
    const msg = v.you.isSpymaster ? 'Sua vez! Dê uma dica para o seu time.' : 'Sua vez! Escolha uma palavra.';
    sfx('myturn');
    toast('🔔 ' + msg);
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch { /* sem vibração */ }
    if (document.hidden) {
      try { if ('Notification' in window && Notification.permission === 'granted') new Notification('CODINONGOS', { body: msg, tag: 'myturn' }); } catch { /* ignora */ }
      if (!titleTimer) {
        let on = false;
        titleTimer = setInterval(() => { on = !on; document.title = on ? '🔔 SUA VEZ!' : BASE_TITLE; }, 900);
      }
    }
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) stopTitleFlash(); });
  addEventListener('focus', stopTitleFlash);

  // ============ ações do usuário ============
  function toast(text, tone = 'info') {
    const el = document.createElement('div');
    el.className = `toast ${tone}`;
    el.textContent = text;
    $('#toasts').appendChild(el);
    setTimeout(() => el.remove(), 3200);
  }

  const nickValue = () => (S.draft.nick || '').trim();

  async function createRoom() {
    askNotify();
    const nick = nickValue();
    if (!nick) return toast('Digite um apelido para entrar.', 'error');
    const token = stored().token || hex(24);
    remember({ token, nick });
    const ack = await act('room:create', { nick, token });
    if (!ack.ok) return toast(ack.error, 'error');
    remember({ code: ack.code, token: ack.token });
  }

  async function joinRoom() {
    askNotify();
    const nick = nickValue();
    const code = (S.draft.code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!nick) return toast('Digite um apelido para entrar.', 'error');
    if (code.length !== 5) return toast('O código da sala tem 5 caracteres.', 'error');
    const token = stored().token || hex(24);
    remember({ token, nick });
    const ack = await act('room:join', { code, nick, token });
    if (!ack.ok) return toast(ack.error, 'error');
    remember({ code: ack.code, token: ack.token });
  }

  async function resolveLan() {
    if (S.lan || !S.view || S.lanChecked) return;
    S.lanChecked = true; // uma tentativa por conexão; evita refazer a busca a cada atualização
    const base = S.server;
    if (!/localhost|127\.0\.0\.1/.test(base)) { S.lan = base; return; }
    try {
      const data = await (await fetch(`${base}/api/network`)).json();
      if (data.ips && data.ips[0]) S.lan = `http://${data.ips[0]}:${location.port || data.port}`;
    } catch { /* sem rede local detectada: usa o endereço atual */ }
    const el = $('#invite-url');
    if (el && S.view) el.textContent = inviteUrl();
  }

  function inviteUrl() {
    const code = S.view ? S.view.code : '';
    if (STATIC_HOST) return `${PAGE_URL}?sala=${code}&servidor=${encodeURIComponent(S.server)}`;
    return `${S.lan || S.server}/codinongos.html?sala=${code}`;
  }

  async function copyInvite() {
    if (STATIC_HOST && /localhost|127\.0\.0\.1/.test(S.server)) toast('Atenção: o convite aponta para localhost. Para os amigos entrarem, coloque o endereço https do túnel no campo Servidor.', 'error');
    const text = `Entra no CODINONGOS! Sala ${S.view.code}: ${inviteUrl()}`;
    let ok = false;
    try {
      await navigator.clipboard.writeText(text);
      ok = true;
    } catch {
      const area = document.createElement('textarea');
      area.value = text;
      document.body.appendChild(area);
      area.select();
      ok = document.execCommand('copy');
      area.remove();
    }
    toast(ok ? 'Convite copiado!' : 'Não consegui copiar. Copie o link manualmente.', ok ? 'info' : 'error');
  }

  function changeConfig(el) {
    const key = el.dataset.cfg;
    let value = el.type === 'checkbox' ? el.checked : el.value;
    if (key === 'voteTimerSec') value = Number(value);
    run('host:config', { config: { [key]: value } });
  }

  function pickCard(index) {
    const v = S.view;
    if (!v || !v.game || v.game.phase === 'over') return;
    const g = v.game;
    const you = v.you || {};
    const onActive = you.team === g.activeTeam;
    const isOperative = onActive && !you.isSpymaster;
    const canDecide = isOperative;

    if (g.phase === 'tiebreak') return canDecide ? run('game:decideTie', { index }) : undefined;
    if (g.phase !== 'guessing') return undefined;

    if (v.config.voteMode === 'vote') {
      if (!isOperative) return undefined;
      return run('game:vote', { index: g.vote && g.vote.mine === index ? null : index });
    }
    if (canDecide) {
      // Modo clássico: toque duas vezes na mesma palavra para confirmar o palpite.
      const key = `${g.turn}:${g.guessesMade}:${index}`;
      if (S.pendingKey === key) {
        S.pendingKey = null;
        return run('game:confirm', { index });
      }
      S.pendingKey = key;
      render();
      return toast('Toque de novo na mesma palavra para confirmar.');
    }
    return undefined;
  }

  async function handle(action, el) {
    switch (action) {
      case 'connect':
        return connect();
      case 'create':
        return createRoom();
      case 'copy':
        return copyInvite();
      case 'dismiss':
        S.notice = '';
        return render();
      case 'leave':
        if (!confirm('Sair da sala?')) return undefined;
        await act('room:leave');
        leaveLocal();
        return render();
      case 'team':
        return run('player:team', { team: el.dataset.team === 'none' ? null : el.dataset.team });
      case 'role':
        return run('player:role', { role: el.dataset.role, on: el.dataset.on === '1' });
      case 'start':
        return run('host:start', {}, 'Partida iniciada!');
      case 'rematch':
        return run('host:start', {}, 'Revanche!');
      case 'restart':
        return run('host:restart');
      case 'end':
        if (!confirm('Encerrar a sala para todos os jogadores?')) return undefined;
        return run('host:end');
      case 'handover':
        return run('host:transfer', { playerId: S.draft.transfer || '' });
      case 'words': {
        const ack = await act('host:words', { mode: el.dataset.mode, text: S.draft.words || '' });
        if (!ack.ok) return toast(ack.error, 'error');
        S.report = ack.report || null;
        if (el.dataset.mode !== 'clear') S.draft.words = '';
        return render();
      }
      case 'clue': {
        const ack = await act('game:clue', { word: S.draft.clue || '', number: S.draft.num || '1' });
        if (!ack.ok) return toast(ack.error, 'error');
        S.draft.clue = '';
        return render();
      }
      case 'pack': {
        const max = (S.view && S.view.limits && S.view.limits.customWordsMax) || ACID.length;
        const list = ACID.slice().sort(() => Math.random() - 0.5).slice(0, max);
        const ack = await act('host:words', { mode: 'replace', text: list.join('\n') });
        if (!ack.ok) return toast(ack.error, 'error');
        S.report = ack.report || null;
        await run('host:config', { config: { onlyCustomWords: el.dataset.only === '1' } });
        toast(`Pacote ácido carregado: ${ack.report ? ack.report.added : list.length} palavras.`);
        return render();
      }
      case 'card':
        return pickCard(Number(el.dataset.i));
      case 'endTurn':
        return run('game:endTurn');
      case 'closeVote':
        return run('game:closeVote');
      case 'revote':
        return run('game:revote');
      case 'hide':
        S.overlayHidden = true;
        return render();
      case 'show':
        S.overlayHidden = false;
        return render();
      case 'dev':
        return void (await run('host:dev', { on: !(S.view && S.view.dev) }));
      case 'sound':
        S.muted = !S.muted;
        remember({ muted: S.muted });
        return render();
      default:
        return undefined;
    }
  }

  // ============ telas ============
  function render() {
    const app = $('#app');
    const active = document.activeElement;
    const focusId = active && active.id;
    const caret = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;

    let html;
    if (!S.view) html = homeHtml();
    else if (!S.view.game) html = lobbyHtml();
    else html = gameHtml();
    app.innerHTML = html;

    $('#sound-btn').textContent = S.muted ? 'SOM: OFF' : 'SOM: ON';
    const devOn = !!(S.view && S.view.dev);
    $('#dev-btn').hidden = !(S.view && S.view.you && S.view.you.isHost);
    $('#dev-btn').textContent = devOn ? 'DEV: ON' : 'DEV: OFF';
    $('#dev-btn').classList.toggle('on', devOn);
    $('#dev-banner').hidden = !devOn;
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el) {
        el.focus();
        if (caret !== null && el.setSelectionRange) el.setSelectionRange(caret, caret);
      }
    }
    if (S.view && !S.view.game) resolveLan();
    if (S.view && S.view.game) fitCardWords();
    flushFx();
    updateTimer();
    chatUpdate();
  }

  // Cartas pequenas (celular): reduz a palavra até caber, sem quebrá-la no meio.
  function fitCardWords() {
    document.querySelectorAll('.card .w').forEach((el) => {
      const face = el.parentElement;
      const cs = getComputedStyle(face);
      const avail = face.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      el.style.fontSize = '';
      el.style.overflowWrap = '';
      let size = parseFloat(getComputedStyle(el).fontSize);
      while (size > 8 && el.offsetWidth > avail) {
        size -= 0.5;
        el.style.fontSize = `${size}px`;
      }
      // Palavra longa demais até no tamanho mínimo: única situação em que ela quebra no meio.
      if (el.offsetWidth > avail) el.style.overflowWrap = 'anywhere';
    });
  }

  function gameHtml() {
    const v = S.view;
    const g = v.game;
    const you = v.you || {};
    const finished = g.phase === 'over';
    const active = g.activeTeam;
    const onActive = you.team === active;
    const isSpyOfActive = !!you.isSpymaster && onActive;
    const isOperative = onActive && !you.isSpymaster;
    const canDecide = isOperative;
    const isHost = !!you.isHost;
    const voteMode = v.config.voteMode === 'vote';
    const vote = g.vote;

    let selectable = false;
    if (!finished) {
      if (g.phase === 'tiebreak') selectable = canDecide;
      else if (g.phase === 'guessing') selectable = voteMode ? isOperative && !!(vote && vote.open) : canDecide || isOperative;
    }

    const cards = g.cards.map((c) => {
      const tallies = (vote && vote.tallies && vote.tallies[c.index]) || (g.marks && g.marks[c.index]) || [];
      const candidate = vote && vote.candidates ? vote.candidates.includes(c.index) : true;
      const tie = g.tie ? g.tie.includes(c.index) : false;
      const canTap = selectable && !c.revealed && (g.tie ? tie : candidate);
      const peek = g.seesIdentities && !c.revealed ? c.identity : null;
      const back = c.revealed ? c.identity : 'hidden';
      const pending = S.pendingKey === `${g.turn}:${g.guessesMade}:${c.index}`;
      const cls = ['card',
        c.revealed ? 'revealed' : '',
        peek ? 'peek-' + peek : '',
        canTap ? 'selectable' : '',
        vote && vote.mine === c.index ? 'mine' : '',
        g.lastRevealed === c.index ? 'last' : '',
        tie ? 'tie' : '',
        pending ? 'pending' : '',
      ].filter(Boolean).join(' ');
      const voters = !c.revealed && tallies.length
        ? `<span class="voters">${tallies.slice(0, 6).map((t) => `<span title="${esc(t.nick)}">${esc(String(t.nick).charAt(0).toUpperCase())}</span>`).join('')}</span>`
        : '';
      return `<button type="button" class="${cls}" style="--tilt:${((c.index * 37) % 5) - 2}deg"
          data-act="card" data-i="${c.index}" data-card="${c.index}" ${canTap ? '' : 'disabled'} aria-label="${esc(c.word)}">
          <span class="inner">
            <span class="face front"><span class="w">${esc(c.word)}</span>${peek ? `<span class="tag">${IDENT_TAG[peek]}</span>` : ''}</span>
            <span class="face back face-${back}"><span class="w">${esc(c.word)}</span>${c.revealed && c.identity ? `<span class="tag">${IDENT_TAG[c.identity]}</span>` : ''}</span>
          </span>
          ${voters}
        </button>`;
    }).join('');

    const spyNames = (team) => v.players.filter((p) => p.team === team && p.spymaster).map((p) => p.nick).join(', ') || 'sem Mestre';
    const score = (team, n, isActive) => `<div class="score ${team} ${isActive ? 'active' : ''}">
        <div class="sn">EQUIPE ${TEAM_UPPER[team]}</div><div class="sv">${String(n).padStart(2, '0')}</div>
        <div class="ss">restam</div><div class="spy">★ ${esc(spyNames(team))}</div></div>`;

    let guide;
    if (finished) guide = 'Partida encerrada. Veja o resultado.';
    else if (!you.team) guide = 'Você está assistindo. Espectadores acompanham o tabuleiro sem interferir.';
    else if (!onActive) guide = `Vez da equipe ${TEAM_NAME[active]}. Acompanhe e aguarde.`;
    else if (g.phase === 'clue') guide = you.isSpymaster ? 'Dê uma dica de UMA palavra e um número.' : 'Aguarde a dica do Mestre Espião.';
    else if (g.phase === 'tiebreak') guide = canDecide ? 'Empate! Escolha uma das palavras empatadas ou peça nova votação.' : 'Empate! Os integrantes da equipe decidem.';
    else if (voteMode) guide = isOperative ? 'Vote em uma palavra. Toque de novo para retirar o voto.' : 'O Mestre Espião não vota. Aguarde a equipe.';
    else guide = canDecide ? 'Toque duas vezes numa palavra para confirmar o palpite.' : 'O Mestre Espião não chuta. Aguarde a equipe.';

    const controls = [];
    if (!finished) {
      if (voteMode && vote && vote.open && canDecide) controls.push('<button class="btn blue small" data-act="closeVote">Encerrar votação agora</button>');
      if (g.phase === 'tiebreak' && canDecide) controls.push('<button class="btn blue small" data-act="revote">Nova votação entre as empatadas</button>');
      if (isHost || canDecide) controls.push('<button class="btn ghost small" data-act="endTurn">Encerrar turno</button>');
    }
    if (isHost) controls.push('<button class="btn ghost small" data-act="restart">Voltar ao lobby</button>', '<button class="btn red small" data-act="end">Encerrar sala</button>');
    else controls.push('<button class="btn ghost small" data-act="leave">Sair da sala</button>');

    const clueForm = isSpyOfActive && g.phase === 'clue' && !finished ? `
      <form class="clue-form" data-form="clue">
        <label class="field"><span>Dica (uma palavra)</span>
          <input id="f-clue" data-d="clue" maxlength="20" autocomplete="off" placeholder="Ex.: Oceano" value="${esc(S.draft.clue || '')}" /></label>
        <label class="field narrow"><span>Número</span>
          <select id="f-num" data-d="num">${Array.from({ length: 10 }, (_, i) => `<option value="${i}" ${String(S.draft.num || '1') === String(i) ? 'selected' : ''}>${i}</option>`).join('')}</select></label>
        <button class="btn gold" type="submit">Enviar dica</button>
      </form>` : '';

    const clueBanner = g.clue && !finished ? `
      <div class="clue ${g.clue.team}">
        <span class="lbl">DICA</span><span class="cw">${esc(g.clue.word)}</span>
        <span class="num">${g.clue.number}</span><span class="gs">palpites ${g.guessesMade}/${g.guessesAllowed}</span>
      </div>` : '';

    const timer = vote && vote.open && v.config.voteTimerSec > 0
      ? '<div class="timer"><div class="bar" id="timer-bar"></div><span id="timer-text">--</span></div>' : '';

    const legendHtml = g.seesIdentities && !finished
      ? '<div class="legend"><span class="lg red">VERMELHA</span><span class="lg blue">AZUL</span><span class="lg neutral">INOCENTE</span><span class="lg assassin">☠ ASSASSINO: NUNCA CHUTE</span></div>' : '';
    const myTurn = isMyTurn(v);
    const overlay = finished && !S.overlayHidden ? resultOverlay(v, g, isHost) : '';
    const showBtn = finished && S.overlayHidden ? '<button class="btn gold small show-result" data-act="show">Ver resultado</button>' : '';

    return `
    <section class="game">
      <div class="hud">
        <div class="hud-row">
          ${score('red', g.remaining.red, active === 'red' && !finished)}
          <div class="center">
            <div class="turn-tag ${active}">${finished ? 'PARTIDA ENCERRADA' : 'VEZ DA EQUIPE ' + TEAM_UPPER[active]}</div>
            <div class="turn-sub">Turno ${g.turn} · ${PHASE_TEXT[g.phase]}</div>
          </div>
          ${score('blue', g.remaining.blue, active === 'blue' && !finished)}
        </div>
        ${clueBanner}
        ${timer}
      </div>

      ${legendHtml}
      <div class="board" role="grid" aria-label="Tabuleiro com 25 palavras">${cards}</div>
      <div class="guide${myTurn ? ' mine' : ''}" role="status">${myTurn ? '<b>🔔 SUA VEZ! </b>' : ''}${esc(guide)}${voteMode && vote && vote.open ? ` · <span class="muted">${Object.values(vote.tallies || {}).reduce((n, l) => n + l.length, 0)} voto(s)</span>` : ''}</div>
      ${clueForm}
      <div class="controls">${controls.join('')}</div>
      <section class="panel"><h3>Registro</h3><ol class="feed">${feedHtml(25)}</ol></section>
    </section>
    ${overlay}${showBtn}`;
  }

  function resultOverlay(v, g, isHost) {
    const winner = g.winner;
    const mine = v.you ? v.you.team : null;
    const won = !!winner && mine === winner;
    const lost = !!winner && !!mine && mine !== winner;
    const title = won ? 'VITÓRIA!' : lost ? 'DERROTA' : `EQUIPE ${winner ? TEAM_UPPER[winner] : ''} VENCEU`;
    const tone = won ? 'gold' : lost ? 'red' : winner || 'gold';
    const ass = g.cards.find((c) => c.identity === 'assassin');
    const s = g.stats;
    const secs = Math.max(0, Math.round(((s.endedAt || Date.now()) - s.startedAt) / 1000));
    const duration = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
    return `
    <div class="overlay" role="dialog" aria-modal="true" aria-label="Resultado da partida">
      <div class="ov-card ${tone}">
        <div class="sub">${g.winReason === 'assassin' ? '☠ A carta preta (assassino) foi revelada: ' + esc(ass ? ass.word : '') : 'Todas as palavras reveladas'}</div>
        <h2>${title}</h2>
        <div class="stats">
          <div><span>${s.turns}</span>turnos</div>
          <div><span>${s.correct}</span>acertos</div>
          <div><span>${s.wrong}</span>erros</div>
          <div><span>${s.neutral}</span>neutras</div>
          <div><span>${s.bestStreak}</span>melhor sequência</div>
          <div><span>${duration}</span>duração</div>
        </div>
        <div class="ov-actions">
          ${isHost
            ? '<button class="btn gold" data-act="rematch">Revanche (novo tabuleiro)</button><button class="btn ghost small" data-act="restart">Voltar ao lobby</button>'
            : '<p class="muted">Aguardando o anfitrião chamar a revanche…</p>'}
          <button class="btn ghost small" data-act="hide">Ver tabuleiro</button>
        </div>
      </div>
    </div>`;
  }

  function updateTimer() {
    const bar = $('#timer-bar');
    const text = $('#timer-text');
    const vote = S.view && S.view.game && S.view.game.vote;
    if (!bar || !text || !vote || vote.remainingMs == null) return;
    const left = Math.max(0, vote.remainingMs - (Date.now() - S.receivedAt));
    const total = Math.max(1, S.view.config.voteTimerSec) * 1000;
    bar.style.width = `${Math.min(100, (left / total) * 100)}%`;
    text.textContent = `${Math.ceil(left / 1000)}s`;
  }


  // ============ chat ============
  const chatState = { open: false, tab: 'all', seen: 0 };
  function chatInit() {
    const box = document.createElement('div');
    box.id = 'chat'; box.hidden = true;
    box.innerHTML = '<section id="chat-panel" hidden><div class="chat-tabs"><button type="button" data-ctab="all">Sala</button><button type="button" data-ctab="team">Equipe</button></div><ol id="chat-list"></ol><form id="chat-form" autocomplete="off"><input id="chat-input" maxlength="200" placeholder="Digite e aperte Enter" /><button class="btn blue small" type="submit">Enviar</button></form></section><button id="chat-toggle" class="btn gold small" type="button">CHAT<span id="chat-badge" hidden></span></button>';
    document.body.appendChild(box);
    $('#chat-toggle').addEventListener('click', () => { chatState.open = !chatState.open; chatUpdate(); if (chatState.open) $('#chat-input').focus(); });
    box.querySelectorAll('[data-ctab]').forEach((b) => b.addEventListener('click', () => { chatState.tab = b.dataset.ctab; chatUpdate(); }));
    $('#chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = $('#chat-input'), text = input.value.trim();
      if (!text) return;
      if (chatState.tab === 'team' && !(S.view && S.view.you.team)) return toast('Entre numa equipe para usar o chat da equipe.', 'error');
      const ack = await act('chat:send', { text, scope: chatState.tab });
      if (!ack.ok) return toast(ack.error || 'Não foi possível enviar.', 'error');
      input.value = '';
    });
  }
  function chatUpdate() {
    const v = S.view, box = $('#chat');
    if (!box) return;
    box.hidden = !v;
    if (!v) return;
    const all = v.chat || [], last = all.length ? all[all.length - 1].id : 0;
    if (chatState.open) chatState.seen = last;
    const unread = all.filter((m) => m.id > chatState.seen && m.nick !== v.you.nick).length;
    const badge = $('#chat-badge'); badge.hidden = !unread; badge.textContent = unread;
    $('#chat-panel').hidden = !chatState.open;
    box.querySelectorAll('[data-ctab]').forEach((b) => b.classList.toggle('on', b.dataset.ctab === chatState.tab));
    const list = $('#chat-list');
    const msgs = all.filter((m) => m.scope === chatState.tab);
    list.innerHTML = msgs.map((m) => `<li class="${m.team || ''} ${m.nick === v.you.nick ? 'me' : ''}"><b>${esc(m.nick)}</b>${esc(m.text)}</li>`).join('') || '<li>Nenhuma mensagem ainda. Mande a primeira!</li>';
    list.scrollTop = list.scrollHeight;
  }

  // ============ eventos globais ============
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    handle(el.dataset.act, el).catch((err) => console.error(err));
  });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset && el.dataset.d) S.draft[el.dataset.d] = el.value;
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset && el.dataset.d) S.draft[el.dataset.d] = el.value;
    if (el.dataset && el.dataset.cfg) changeConfig(el);
    if (el.dataset && el.dataset.pack) run('host:config', { config: { packs: [...document.querySelectorAll('[data-pack]:checked')].map((x) => x.dataset.pack) } });
  });
  document.addEventListener('submit', (e) => {
    e.preventDefault();
    const form = e.target;
    if (form.dataset.form === 'join') joinRoom();
    if (form.dataset.form === 'clue') handle('clue', form).catch((err) => console.error(err));
  });
  document.addEventListener('pointerdown', () => { audio(); }, { once: true });
  setInterval(updateTimer, 200);

  // ============ início ============
  chatInit();
  startBackground();
  render();
  connect();
  // Fontes carregadas e mudanças de tamanho da tela alteram a medida das cartas.
  if (document.fonts) document.fonts.ready.then(() => S.view && S.view.game && fitCardWords());
  addEventListener('resize', () => S.view && S.view.game && fitCardWords());
})();
</script>
</body>
</html>
